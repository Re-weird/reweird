services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: "8080"
      API_HOST: 0.0.0.0
      API_TRUSTED_NETWORK: "true"
      DATABASE_PATH: /data/reweird.db
      UPLOAD_DIR: /data/uploads
      PROBE_SERVICE_URL: http://probe:8091
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - reweird-data:/data
    depends_on:
      - probe

  probe:
    build:
      context: .
      dockerfile: services/probe/Dockerfile
    environment:
      PROBE_AI_PROVIDER: ${PROBE_AI_PROVIDER:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      DIAGNOSTIC_REPOSITORY: memory
      TELEMETRY_SINK: none
      ANALYTICS_SINK: none
      PROBE_REPORTER_TOKEN: ${PROBE_REPORTER_TOKEN:-}
      PROBE_REPORTER_ID: ${PROBE_REPORTER_ID:-}
    ports:
      - "127.0.0.1:8091:8091"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  reweird-data:
