[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DREWEIRD_PATCH_LOCKED=1
  -DARDUINOJSON_USE_LONG_LONG=1
  '-D REWEIRD_PROFILE_ID_OVERRIDE="${sysenv.REWEIRD_PROFILE_ID}"'

; ESP32-S3 probe board on native USB (Windows shows "USB Serial Device").
; Serial is routed to the USB-Serial/JTAG port so Telemetry v2 appears on that
; COM port. Flash is pinned to 4 MB so the image boots on any S3 module size.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.partitions = default.csv
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  adafruit/Adafruit SSD1306@^2.5.7
  adafruit/Adafruit GFX Library@^1.11.9
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DREWEIRD_PATCH_LOCKED=1
  -DARDUINOJSON_USE_LONG_LONG=1
  '-D REWEIRD_PROFILE_ID_OVERRIDE="${sysenv.REWEIRD_PROFILE_ID}"'
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; Serial-monitor-only display diagnostics. Keep the API stopped in this mode:
; telemetry frames continue, but plain-text diagnostics are not API input.
[env:esp32s3-displaydiag]
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DREWEIRD_DISPLAY_DIAGNOSTICS=1
